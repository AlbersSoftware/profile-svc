server:
  port: 8081

spring:

  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate

    open-in-view: false

    properties:
      hibernate:
        default_schema: profile

  liquibase:
    enabled: true
    default-schema: profile
    change-log: classpath:db/changelog/db.changelog-master.yaml





aws:
  cognito:
    region: us-east-1
    user-pool-id: your-user-pool-id
    client-id: your-client-id
    issuer-uri: https://cognito-idp.us-east-1.amazonaws.com/your-user-pool-id
